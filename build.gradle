plugins {
	id 'java'
	id 'jacoco' // couverture de tests
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.5.0.8588' // qualité de code (SonarCloud)
}

group = 'fr.miage'
// la CI de release passe la version du tag : -PversionLivraison=0.1.0
version = findProperty('versionLivraison') ?: '0.1.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// documentation OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// vérifie les règles de dépendance de l'architecture hexagonale
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// expose nom et version du projet au runtime (utilisé par /api/v1/info)
springBoot {
	buildInfo()
}

// seul le jar exécutable (bootJar) est produit, c'est lui qui est joint à la release
tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
	reports {
		xml.required = true // lu par Codecov et SonarCloud
		html.required = true
	}
}

// renseigner sonarProjectKey / sonarOrganization dans gradle.properties
sonar {
	properties {
		property 'sonar.projectKey', findProperty('sonarProjectKey') ?: 'CHANGE_ME'
		property 'sonar.organization', findProperty('sonarOrganization') ?: 'CHANGE_ME'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.coverage.jacoco.xmlReportPaths', "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}
