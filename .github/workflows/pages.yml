name: Page de projet

# Publie site/ sur GitHub Pages à chaque push sur main, avec la dernière version du dossier.
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/outils-doc
      - name: Documentation et site
        run: make -B -C doc && make -B -C doc site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deploiement
        uses: actions/deploy-pages@v4
