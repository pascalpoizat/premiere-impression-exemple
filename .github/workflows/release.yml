name: Release

# Pousser un tag v* (v0.1.0, v0.1.0-SNAPSHOT…) construit l'application et la documentation,
# puis publie la release GitHub avec le jar et le dossier PDF en pièces jointes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # création de la release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build et tests (version = tag sans le « v »)
        run: ./gradlew build -PversionLivraison="${GITHUB_REF_NAME#v}"

      - uses: ./.github/actions/outils-doc

      - name: Documentation
        run: make -B -C doc

      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=""
          case "$GITHUB_REF_NAME" in *-*) options="--prerelease" ;; esac   # v0.1.0-SNAPSHOT : pré-livraison
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar doc/dossier.pdf \
            --title "$GITHUB_REF_NAME" --generate-notes $options
